<meta charset="utf-8">
<title>Session Board</title>
<style>
  :root {
    --bg: #11131a;
    --bg-row: #171a23;
    --bg-row-hover: #1e222e;
    --line: #262b38;
    --ink: #e7eaf0;
    --ink-dim: #8b93a5;
    --working: #3ddc84;
    --waiting: #ffb531;
    --stalled: #d98a3a;
    --blocked: #ff6b5e;
    --parked: #5f7794;
    --closed: #3c424e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    position: relative;
    height: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* No native drag region anywhere: macOS gives a drag region's double-click to
     the system title-bar action instead of to the page, so the whole bar is
     driven from script to keep click, double-click and drag ours. */
  .grip {
    height: 26px;
    flex: 0 0 auto;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
  }
  .grip:active { cursor: grabbing; }
  .grip button {
    background: none; border: 0; padding: 4px 14px; cursor: pointer;
    color: inherit; display: flex; align-items: center; border-radius: 5px;
  }
  .grip button:hover { background: #1d2230; color: var(--ink); }
  .grip svg { opacity: .5; }
  .grip button:hover svg { opacity: .9; }

  /* Window controls ride the top bar, where there is room once the panel is
     open. The rail is 58px wide and has none: the menu bar icon is the handle
     for a collapsed board. */
  .wctl {
    position: absolute; right: 3px; top: 0; height: 26px;
    display: flex; align-items: center; gap: 1px;
  }
  .wctl button { padding: 5px 6px; }
  .wctl button.on svg { opacity: .95; }
  .wctl #close:hover { background: #46211d; color: #ffb3aa; }

  /* ---- collapsed rail ---- */
  .rail { flex: 1; justify-content: flex-start; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 4px 0 10px; }
  .rail .count {
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    color: var(--ink-dim); margin-bottom: 2px;
  }
  .rail .count.alert { color: var(--waiting); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .dot.working { background: var(--working); animation: breathe 1.6s ease-in-out infinite; }
  .dot.waiting { background: var(--waiting); box-shadow: 0 0 0 3px rgba(255,181,49,.16); }
  .dot.stalled { background: var(--stalled); }
  .dot.blocked { background: var(--blocked); box-shadow: 0 0 0 3px rgba(255,107,94,.18); }
  .dot.parked  { background: var(--parked); }
  .dot.closed  { background: var(--closed); }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .42; } }

  /* ---- expanded list ---- */
  .head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 0 12px 9px; border-bottom: 1px solid var(--line);
  }
  /* Plan usage strip. Two bars side by side when there's room, stacked in the
     390px list. The fill is the usage panel's neutral bar colour until a
     window gets close to its limit, where amber and red mean what they mean
     everywhere else on the board; the percentage is always printed beside it,
     so the colour is never the only signal. */
  .limits { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 7px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; font-size: 10.5px; color: var(--ink-dim); }
  .limits:hover { background: var(--bg-row-hover); }
  .lim { display: flex; align-items: center; gap: 7px; flex: 1 1 250px; min-width: 0; }
  .lim .lbl { width: 42px; flex: none; }
  .lim .trk { flex: 1; height: 6px; background: var(--bg-row); border-radius: 3px; overflow: hidden; min-width: 40px; }
  .lim .fill { display: block; height: 100%; background: #7b8fd1; border-radius: 3px; }
  .lim .fill.near { background: var(--waiting); }
  .lim .fill.over { background: var(--blocked); }
  .lim .pct { width: 30px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; flex: none; }
  .lim .rst { width: 98px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .head .sub { font-size: 11px; color: var(--ink-dim); margin-left: auto; }
  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: #262b38; border-radius: 4px; }
  .group { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: #5a6274; padding: 10px 4px 5px; }
  .row {
    display: grid; grid-template-columns: 14px 1fr; gap: 9px;
    padding: 8px 9px; border-radius: 8px; cursor: pointer;
    background: var(--bg-row); margin-bottom: 5px; align-items: start;
  }
  .row:hover { background: var(--bg-row-hover); }
  .row .dot { margin-top: 4px; }
  .row .title { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Context past the point where every turn gets expensive. Amber is a
     heads-up, red is "hand this off": see CTX_HEAVY / CTX_HUGE. */
  .meta.ctx-heavy { color: var(--waiting); }
  .meta.ctx-huge { color: var(--blocked); }
  #office .other.ctx-heavy .what::after { content: ' ●'; color: var(--waiting); }
  #office .other.ctx-huge .what::after { content: ' ●'; color: var(--blocked); }
  #office .chat-head .lead.ctx-heavy { color: var(--waiting); }
  #office .chat-head .lead.ctx-huge { color: var(--blocked); }
  .ball.ctx-heavy { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--waiting); }
  .ball.ctx-huge { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blocked); }
  .row .meta { font-size: 10.5px; color: var(--ink-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.is-waiting .title { color: var(--waiting); }
  .row.is-blocked .title { color: var(--blocked); }
  .row.live { padding: 10px; background: #191d28; cursor: pointer; }
  .row.live:hover { background: #1f2432; }
  .actions { display: flex; gap: 6px; margin-top: 7px; }
  .actions button, .disclosure {
    font: inherit; font-size: 10.5px; color: var(--ink-dim);
    background: #222836; border: 1px solid #2d3444; border-radius: 5px;
    padding: 3px 7px; cursor: pointer;
  }
  .actions button:hover { color: var(--ink); border-color: #3d475b; }
  .ask { margin-top: 7px; }
  .ask textarea {
    width: 100%; height: 54px; resize: none; font: inherit; font-size: 11.5px;
    color: var(--ink); background: #0d1017; border: 1px solid #2d3444;
    border-radius: 6px; padding: 6px 7px; outline: none;
  }
  .ask textarea:focus { border-color: #44506a; }
  .answer {
    margin-top: 7px; background: #0d1017; border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 9px; font-size: 11px; line-height: 1.5;
    color: #c3cad8; max-height: 210px; overflow-y: auto; white-space: pre-wrap;
    user-select: text;
  }
  .answer.err { color: #ff9a90; }
  .answer .who { color: #5f6a7e; display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
  .disclosure { width: 100%; text-align: left; margin: 10px 0 6px; }
  .empty { color: #5a6274; font-size: 11.5px; padding: 18px 6px; text-align: center; }
  .row.is-closed { background: transparent; }
  .row.is-closed .title { color: #9aa2b2; font-weight: 400; }
  /* Usage panel: an overlay over whichever view is open, so the window never
     resizes for it. Bars are magnitude, one hue, deliberately none of the
     state colours (green/amber/red mean a session's state everywhere else).
     #7b8fd1 checked with the dataviz validator against --bg: passes. */
  #usage { position: absolute; inset: 0; z-index: 20; background: var(--bg);
    display: flex; flex-direction: column; min-height: 0; }
  #usage .u-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line); }
  #usage .u-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
  #usage .u-tabs { display: flex; gap: 2px; margin-left: auto; }
  #usage button { font: inherit; font-size: 11px; background: transparent; color: var(--ink-dim);
    border: 1px solid transparent; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #usage button:hover { color: var(--ink); }
  #usage .u-tabs button.on { border-color: var(--line); color: var(--ink); background: var(--bg-row); }
  #usage .u-body { overflow-y: auto; padding: 14px; flex: 1; min-height: 0; }
  #usage .u-inner { max-width: 560px; margin: 0 auto; }
  #usage .u-hero { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  #usage .u-hero small { font-size: 12px; font-weight: 400; color: var(--ink-dim); margin-left: 6px; }
  #usage .u-stats { color: var(--ink-dim); font-size: 11px; margin-top: 3px; }
  #usage .u-note { color: var(--ink-dim); font-size: 10.5px; margin-top: 8px; line-height: 1.45; }
  #usage h3 { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim);
    font-weight: 600; margin: 20px 0 6px; }
  #usage .u-row { display: grid; grid-template-columns: minmax(0, 1fr) 34% 64px; gap: 8px;
    align-items: center; padding: 3px 0; font-size: 11.5px; }
  #usage .u-row:hover { background: var(--bg-row-hover); }
  #usage .u-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #usage .u-name small { color: var(--ink-dim); margin-left: 5px; }
  #usage .u-track { height: 8px; }
  #usage .u-bar { height: 8px; background: #7b8fd1; border-radius: 0 4px 4px 0; min-width: 2px; }
  #usage .u-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .foot {
    display: flex; gap: 5px; align-items: center; flex-wrap: nowrap;
    padding: 7px 9px; border-top: 1px solid var(--line); font-size: 10px; color: var(--ink-dim);
  }
  .foot button {
    font: inherit; color: var(--ink-dim); background: none; border: 0;
    cursor: pointer; padding: 2px 3px; white-space: nowrap; flex: 0 0 auto;
  }
  .foot #src {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .foot button:hover { color: var(--ink); }
  .foot button.on { color: var(--working); }
  .foot .push { margin-left: auto; }
  .toast {
    position: absolute; left: 10px; right: 10px; bottom: 36px;
    background: #222838; border: 1px solid #343b4d; border-radius: 7px;
    padding: 7px 9px; font-size: 10.5px; color: var(--ink);
    opacity: 0; transition: opacity .18s; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; }
  /* ---- map ---- */
  #map {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, #1d2230 1px, transparent 0) 0 0 / 22px 22px,
      var(--bg);
  }
  .wires { position: absolute; inset: 0; pointer-events: none; color: #3f4a61; }
  .edge {
    fill: none; stroke: #3f4a61; stroke-width: 1.6;
    marker-end: url(#arrow); pointer-events: none;
  }
  /* invisible, fat, and the only thing that takes clicks */
  .edge-hit {
    fill: none; stroke: transparent; stroke-width: 14;
    pointer-events: stroke; cursor: pointer;
  }
  .edge.answered { stroke: #4c7f6a; }
  .edge.sel { stroke: var(--ink); stroke-width: 2.2; }
  .edge.temp { stroke: var(--waiting); stroke-dasharray: 4 3; marker-end: none; }
  .edge.busy {
    stroke: var(--waiting); stroke-width: 2.4;
    stroke-dasharray: 7 5; animation: flow .7s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .node {
    position: absolute; width: 172px; height: 60px; box-sizing: border-box;
    background: #1a1f2b; border: 1px solid #2b3242; border-radius: 9px;
    padding: 8px 9px; cursor: grab; user-select: none;
  }
  .node:active { cursor: grabbing; }
  .node.is-working { border-color: #2f5f45; }
  .node.is-waiting { border-color: #6b5420; }
  .node.is-blocked { border-color: #6d3a35; }
  .node-top { display: flex; align-items: center; gap: 6px; }
  .node-title {
    font-size: 11.5px; font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .node-meta { font-size: 10px; color: var(--ink-dim); margin-top: 4px; margin-left: 16px; }
  .port {
    position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: #39445a; border: 2px solid var(--bg); cursor: crosshair;
  }
  .port:hover { background: var(--waiting); }
  /* The bin sits in the map's bottom-left, out of the way of the ring that
     unplaced nodes land on. Pointer-events off: the drop is decided from the
     pointer's position, and a node parked over it must stay grabbable. */
  #trash {
    position: absolute; left: 12px; bottom: 12px;
    width: 46px; height: 46px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: #161b26; border: 1px dashed #2f3647; color: #5a6276;
    pointer-events: none; opacity: .5;
    transition: opacity .15s, color .15s, border-color .15s, background .15s, transform .12s;
  }
  #trash.armed { opacity: 1; border-color: #495270; color: #8b93a5; }
  #trash.hot {
    border-style: solid; border-color: var(--blocked); color: var(--blocked);
    background: #2a1a1c; transform: scale(1.12);
  }
  .trash-cap {
    position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%);
    font-size: 9.5px; white-space: nowrap; color: inherit; opacity: 0;
    transition: opacity .15s;
  }
  #trash.hot .trash-cap { opacity: 1; }
  .node.doomed { opacity: .55; border-color: var(--blocked); }
  #composer {
    border-top: 1px solid var(--line); padding: 9px 11px; background: #141822;
    max-height: 290px; overflow-y: auto;
  }
  .comp-head { display: flex; align-items: center; gap: 7px; font-size: 11px; margin-bottom: 7px; }
  .comp-head strong { font-weight: 600; }
  .comp-head button {
    font: inherit; font-size: 10px; color: var(--ink-dim); background: #222836;
    border: 1px solid #2d3444; border-radius: 5px; padding: 2px 6px; cursor: pointer;
  }
  .comp-head button:first-of-type { margin-left: auto; }
  #composer textarea {
    width: 100%; height: 44px; resize: none; font: inherit; font-size: 11.5px;
    color: var(--ink); background: #0d1017; border: 1px solid #2d3444;
    border-radius: 6px; padding: 6px 7px; outline: none;
  }
  .comp-actions { margin-top: 6px; }
  .comp-actions button {
    font: inherit; font-size: 10.5px; color: var(--ink); background: #273047;
    border: 1px solid #38425c; border-radius: 5px; padding: 4px 9px; cursor: pointer;
  }
  .comp-actions button:disabled { opacity: .55; cursor: default; }
  [hidden] { display: none !important; }

  /* ---- office view ---- */
  /* The plan is black ink on transparency, and the panel is dark, so the floor
     needs a light ground under it or the drawing simply is not there. */
  /* A row, not a column: the plan is portrait inside a wide window, so it sits
     against the left edge with a margin and the docked terminal takes the
     rest. Centring the plan would leave a gutter on both sides and anchor it
     to nothing. */
  #office { display: flex; flex-direction: row; align-items: stretch; gap: 12px;
            flex: 1; min-height: 0; padding: 10px 12px 14px 16px; position: relative; }
  #office[hidden] { display: none; }
  /* The plan measures itself against this box, so it must hold no padding of
     its own and must be free to shrink, hence min-width: 0 on a flex child. */
  /* Shrink-to-fit around the plan, which is sized in code. It cannot be flex:1
     any more: the docked terminal shares this row, so the plan's width is worked out from
     the whole view rather than measured from the box it sits in, which would
     be circular. */
  #office .stage { flex: 0 0 auto; display: flex; align-items: flex-start; }
  #office .chat-head { display: flex; gap: 6px; flex: 0 0 auto; }
  #office .term[hidden], #office .dock-empty[hidden] { display: none; }
  #office .dock { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #office .slot { flex: 1; min-height: 0; position: relative; }
  /* The xterm sizes itself to this box, padding excluded. */
  #office .term { position: absolute; inset: 0; padding: 6px 4px 4px 8px; background: #0d0f15;
                  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #office .dock-empty { position: absolute; inset: 0; display: flex; align-items: center;
                        justify-content: center; text-align: center; padding: 12px;
                        border: 1px dashed var(--line); border-radius: 10px;
                        color: var(--ink-dim); font-size: 12px; }
  #office .drop-hot { outline: 2px dashed var(--ink-dim); outline-offset: -2px; }
  #office .chat-head .lead { flex: 1; min-width: 0; font-size: 11px; color: var(--ink);
                             padding: 3px 2px; overflow: hidden; text-overflow: ellipsis;
                             white-space: nowrap; }
  /* One box per session that is not the lead. Current task only: the title the
     session gave itself, and its state as a colour. No directory, no timings,
     no buttons. Knowing what each one is doing is the whole job here; anything
     more is the list view, which is one click away. */
  #office .others { display: flex; flex-wrap: wrap; gap: 5px; flex: 0 0 auto; }
  #office .other { display: flex; align-items: center; gap: 5px; max-width: 100%;
                   font-size: 10px; color: var(--ink-dim); background: var(--bg);
                   border: 1px solid var(--line); border-radius: 3px;
                   padding: 3px 7px; cursor: pointer; }
  #office .other:hover { border-color: var(--ink-dim); }
  #office .other .pip { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  #office .other .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Hidden until the box is hovered: five boxes each carrying two always-on
     controls would read as a toolbar rather than as a list of who is here. */
  #office .other .go { display: none; color: var(--ink-dim); padding: 0 1px; }
  #office .other:hover .go { display: inline; }
  #office .other .go:hover { color: var(--ink); }
  #office .other .go[data-act="end"]:hover { color: var(--blocked); }
  /* A session waiting on a permission prompt cannot be answered from here, so
     the box says so and the only useful thing is to go and look at it. */
  #office .other.is-blocked { border-color: var(--blocked); color: var(--blocked); }
  #office .other.is-blocked .go { display: inline; }
  #office .pop.hire { width: 230px; }
  #office .fld { display: flex; flex-direction: column; gap: 3px; }
  #office .fld input, #office .fld textarea, #office .fld select {
    font: inherit; font-size: 11px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px; resize: none; }
  #office .fld-row { display: flex; gap: 6px; }
  #office .fld-row button { flex: 1; font: inherit; font-size: 11px; cursor: pointer;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px; }
  #office .fld-row button:hover { background: var(--bg-row-hover); }
  #office .chat-head button { background: var(--bg); color: var(--ink-dim);
                              border: 1px solid var(--line); border-radius: 3px;
                              font: inherit; font-size: 11px; padding: 2px 7px; cursor: pointer; }
  /* About an inch. Fixed, so the plan never trades size against the controls. */
  .menu { position: absolute; right: 6px; top: 28px; z-index: 20; min-width: 150px;
          display: flex; flex-direction: column; padding: 4px;
          background: var(--bg-row); border: 1px solid var(--line); border-radius: 6px;
          box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .menu[hidden] { display: none; }
  .menu button { text-align: left; background: none; border: 0; border-radius: 4px;
                 color: var(--ink); font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; }
  .menu button:hover { background: var(--bg-row-hover); }
  .menu button.on { color: var(--working); }
  /* Under the top bar's gear, where the menu that opens it was. */
  #office .pop { position: absolute; right: 6px; top: 0; width: 180px; z-index: 5;
                 display: flex; flex-direction: column; gap: 9px; font-size: 10px;
                 color: var(--ink-dim); background: var(--bg-row); padding: 9px;
                 border: 1px solid var(--line); border-radius: 4px;
                 box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #office .pop[hidden] { display: none; }
  #office .floor { position: relative; flex: 0 0 auto; border-radius: 3px;
                   background: #e9e5dc; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  #office .plan { width: 100%; height: 100%; display: block; }
  #office .geo, #office .balls { position: absolute; inset: 0; }
  #office .geo { width: 100%; height: 100%; display: none; overflow: visible; }
  #office.show-geo .geo { display: block; }

  .geo-office { fill: rgba(80,150,255,.10); stroke: rgba(80,150,255,.75); stroke-width: .003; }
  .geo-table  { fill: none; stroke: rgba(0,200,120,.8); stroke-width: .004; }
  .geo-door   { stroke: #15c05a; stroke-width: .010; stroke-linecap: round; }
  .geo-spine  { stroke: rgba(255,120,200,.75); stroke-width: .004; stroke-dasharray: .02 .014; }
  .geo-slot   { fill: rgba(0,200,120,.85); }
  .geo-label  { font-size: .030px; fill: rgba(80,150,255,.95); }

  /* A ball is positioned by its centre, which is what the movement layer
     reports, so it is nudged back by half its own size rather than the view
     having to know the radius. */
  /* Only while something is being carried. A bin sitting permanently on the
     drawing is clutter, and the drawing is the point of this view. */
  #office .bin { position: absolute; left: 10px; bottom: 10px; width: 46px; height: 46px;
                 display: none; align-items: center; justify-content: center;

                 background: rgba(255,255,255,.55); }
  #office.dragging .bin { display: flex; }

                     border-style: solid; background: rgba(255,107,94,.18); }

<!-- The dock's terminal. Loaded from the app's own node_modules, which works
     both from the project and from inside the packaged app's asar. -->
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="canvas.js"></script>
<script src="office/geometry.js"></script>
<script src="office/routes.js"></script>
<script src="office/agents.js"></script>
<script src="office/view.js"></script>
<script>
  const LABEL = {
    working: 'working',
    waiting: 'waiting on you',
    blocked: 'blocked on a prompt',
    stalled: 'no output 2m+',
    parked: 'parked',
    closed: '',
  };
  let expanded = false;
  // The expanded panel shows exactly one of these. Kept as a name rather than
  // a pair of booleans so there is no state where both the map and the office
  // believe they are open. map and office are each a direct toggle: clicking
  // one twice returns to list, which is otherwise reached only by switching
  // away from whichever of the two is open.
  const VIEWS = new Set(['list', 'map', 'office']);
  let view = 'office';
  let current = { sessions: [], links: [], liveCount: 0, waitingCount: 0 };
  let showRecent = false;
  let onTop = true;
  let openAsk = null;            // session id whose ask box is open
  const answers = Object.create(null);  // session id -> { text, err }

  const el = (id) => document.getElementById(id);

  function age(sec) {
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.round(sec / 60) + 'm';
    if (sec < 86400) return Math.round(sec / 3600) + 'h';
    return Math.round(sec / 86400) + 'd';
  }

  // Context is bounded by a model's window, so three digits of precision is
  // never wrong by much; total can run into the hundreds of millions on a
  // long session (every turn re-bills whatever of its prompt came from
  // cache), where one decimal place is still the honest size of the number.
  // What one board-made call cost, from the usage block claude -p returns.
  // Shown beside every answer so the price of a click is never a surprise.
  function costLine(c) {
    if (!c) return '';
    return `${c.model} · ${fmtTokens(c.tokens)} tok · $${c.usd < 0.01 ? c.usd.toFixed(4) : c.usd.toFixed(3)}`;
  }

  function fmtTokens(n) {
    if (n == null) return '—';
    if (n < 1000) return String(n);
    if (n < 1e6) return Math.round(n / 1e3) + 'K';
    if (n < 1e9) return (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + 'M';
    return (n / 1e9).toFixed(1) + 'B';
  }

  // Context is this turn's prompt; total is every turn's prompt and reply
  // summed over the session's life, cache reuse counted every time it's
  // resent, which is also how Claude Code's own cost accounting counts it.
  // Every turn resends the whole context, so its size is what a turn costs,
  // whatever the window allows (1M on every current model). A fresh session
  // starts around 50-60K; measured 2026-10-15, the multi-session builds were
  // running at 300-530K, which is where the spend went. These are cost lines,
  // not fullness lines.
  const CTX_HEAVY = 200000;
  const CTX_HUGE = 400000;
  function ctxLevel(s) {
    const n = s && s.contextTokens;
    if (!n) return '';
    return n >= CTX_HUGE ? 'ctx-huge' : n >= CTX_HEAVY ? 'ctx-heavy' : '';
  }

  // claude-opus-5-5 -> opus, so a successor starts on the same tier.
  function aliasOf(model) {
    const m = /(opus|sonnet|haiku)/.exec(model || '');
    return m ? m[1] : undefined;
  }

  async function handOff(s) {
    toast('writing a handoff for ' + (s.title || 'that session') + '…');
    const res = await window.board.handoff({
      sessionId: s.sessionId, title: s.title, model: aliasOf(s.model), slot: liveSlots(),
    });
    toast(res.ok ? res.out : res.error);
    dockStarted(res);
  }

  function tokenLine(s) {
    if (s.contextTokens == null && s.totalTokens == null) return '';
    return `${fmtTokens(s.contextTokens)} ctx · ${fmtTokens(s.totalTokens)} total`;
  }

  function folder(s) {
    return s.cwdShort || '?';
  }

  function renderRail() {
    const live = current.sessions.filter((s) => s.pid);
    const waiting = current.waitingCount;
    const bits = [`<div class="count ${waiting ? 'alert' : ''}">${live.length}</div>`];
    for (const s of live.slice(0, 14)) {
      bits.push(`<div class="dot ${s.state}" title="${esc(s.title)} (${LABEL[s.state]})"></div>`);
    }
    if (!live.length) bits.push('<div class="dot closed" title="no live sessions"></div>');
    el('rail').innerHTML = bits.join('');
  }

  // How many grid slots are already taken, so a new window lands in the next one.
  function liveSlots() {
    return current.sessions.filter((s) => s.pid && s.tty).length;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function renderList() {
    const live = current.sessions.filter((s) => s.pid);
    const dead = current.sessions.filter((s) => !s.pid).slice(0, 14);
    const out = [];

    if (live.length) {
      for (const s of live) out.push(liveRow(s));
    } else {
      out.push('<div class="empty">no sessions running</div>');
    }

    if (dead.length) {
      out.push(`<button class="disclosure" id="disc">${showRecent ? '▾' : '▸'} recent (${dead.length})</button>`);
      if (showRecent) for (const s of dead) out.push(deadRow(s));
    }

    el('list').innerHTML = out.join('');
    el('sub').textContent = current.waitingCount
      ? `${current.waitingCount} waiting on you`
      : `${live.length} running`;

    // Say when the registry and the process scan disagree, rather than quietly
    // papering over it: a missed session would otherwise read as closed.
    const missed = current.registryMissed || 0;
    const unmatched = current.unmatchedPids || 0;
    const srcEl = el('src');
    srcEl.textContent = (missed || unmatched) ? `${current.source} ⚠${missed + unmatched}` : current.source;
    srcEl.title = (missed || unmatched)
      ? `${missed} live session(s) the registry did not report, ${unmatched} process(es) with no transcript`
      : 'session source: ' + current.source;
    srcEl.style.color = (missed || unmatched) ? 'var(--waiting)' : '';
    // Only shown when it has something to say: the footer ran out of room at
    // 390px once usage joined it, and the plain source name ("registry") was
    // the one item that told nobody anything.
    srcEl.hidden = !(missed || unmatched);
    wire();
  }

  function liveRow(s) {
    const meta = s.untouched
      ? `${LABEL[s.state]} · no prompt yet · ${folder(s)}`
      : `${LABEL[s.state]} · ${age(s.idleSec)} quiet · ${folder(s)}`;
    const a = answers[s.sessionId];
    return `<div class="row live is-${s.state}" data-id="${s.sessionId}">
      <div class="dot ${s.state}"></div>
      <div style="min-width:0">
        <div class="title">${esc(s.title)}</div>
        <div class="meta">${esc(meta)}${peerOf(s) ? ' · ' + esc(peerOf(s)) : ''}</div>
        ${tokenLine(s) ? `<div class="meta ${ctxLevel(s)}">${esc(tokenLine(s))}</div>` : ''}
        <div class="actions">
          <button data-act="ask" data-id="${s.sessionId}">ask it</button>
          <button data-act="resume" data-id="${s.sessionId}">copy cmd</button>
          ${peerOf(s) ? `<button data-act="peer" data-id="${s.sessionId}">copy handle</button>` : ''}
          ${ctxLevel(s) ? `<button data-act="handoff" data-id="${s.sessionId}" title="start a fresh session from a summary of this one">hand off</button>` : ''}
        </div>
        ${openAsk === s.sessionId ? askBox(s) : ''}
        ${a ? `<div class="answer ${a.err ? 'err' : ''}"><span class="who">${a.err ? 'failed' : 'answered from its history' + (a.cost ? ' · ' + esc(a.cost) : '')}</span>${esc(a.text)}</div>` : ''}
      </div>
    </div>`;
  }

  // Only interactive sessions register as messageable peers, and a background
  // session's "name" is just its generated title, so it is not a peer handle.
  function peerOf(s) {
    if (s.kind !== 'interactive') return null;
    if (!s.peerName || s.peerName === s.title) return null;
    return s.peerName;
  }

  function askBox(s) {
    return `<div class="ask">
      <textarea id="ask-input" placeholder="ask this session something (it answers from its own history)"></textarea>
      <div class="actions">
        <button data-act="send" data-id="${s.sessionId}">send</button>
        <button data-act="cancel" data-id="${s.sessionId}">cancel</button>
      </div>
    </div>`;
  }

  function deadRow(s) {
    return `<div class="row is-closed" data-id="${s.sessionId}">
      <div class="dot ${s.state}"></div>
      <div style="min-width:0">
        <div class="title">${esc(s.title)}</div>
        <div class="meta">${esc(age(s.idleSec) + ' ago · ' + folder(s))} · click to reopen</div>
      </div>
    </div>`;
  }

  function wire() {
    const disc = el('disc');
    if (disc) disc.onclick = () => { showRecent = !showRecent; renderList(); };

    for (const b of el('list').querySelectorAll('button[data-act]')) {
      b.onclick = (ev) => {
        ev.stopPropagation();
        const s = current.sessions.find((x) => x.sessionId === b.dataset.id);
        if (!s) return;
        const act = b.dataset.act;
        if (act === 'ask') { openAsk = s.sessionId; renderList(); el('ask-input').focus(); }
        else if (act === 'cancel') { openAsk = null; renderList(); }
        else if (act === 'peer') window.board.copyPeer(peerOf(s)).then((n) => toast('copied: ' + n));
        else if (act === 'resume') window.board.copyResume(s).then((c) => toast('copied: ' + c));
        else if (act === 'send') send(s);
        else if (act === 'handoff') handOff(s);
      };
    }

    // Clicking a running session jumps to the terminal window it lives in.
    for (const node of el('list').querySelectorAll('.row.live')) {
      node.onclick = () => {
        const s = current.sessions.find((x) => x.sessionId === node.dataset.id);
        if (!s) return;
        if (!s.tty) { toast('no terminal window for this one'); return; }
        window.board.focusSession(s.tty).then((res) => {
          if (!res.ok) toast(res.error || 'could not reach that window');
        });
      };
    }

    for (const node of el('list').querySelectorAll('.row.is-closed')) {
      node.onclick = () => {
        const s = current.sessions.find((x) => x.sessionId === node.dataset.id);
        if (!s) return;
        toast('opening ' + s.title + '…');
        window.board.openSessionWindow({ cwd: s.cwd, resumeId: s.sessionId, slot: liveSlots() })
          .then((res) => { toast(res.ok ? res.out : res.error); dockStarted(res); });
      };
    }
  }

  function send(s, override) {
    const box = el('ask-input');
    const question = override || (box ? box.value : '');
    if (!question.trim()) { toast('type a question first'); return; }
    openAsk = null;
    answers[s.sessionId] = { text: 'asking…', err: false };
    renderList();
    window.board.consult({ sessionId: s.sessionId, cwd: s.cwd, question }).then((res) => {
      answers[s.sessionId] = res.ok
        ? { text: res.answer, err: false, cost: costLine(res.cost) }
        : { text: res.error, err: true };
      renderList();
    });
  }

  let toastTimer;
  function toast(msg) {
    const t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function paint() {
    syncDock();
    if (!expanded) { renderRail(); return; }
    if (view === 'office') {
      paintDockHeads();
      syncHideBtn();
      window.Office.update(current.sessions, current.links);
    }
    else if (view === 'map') window.Canvas.update(current.sessions);
    else renderList();
  }

  // Which view the panel shows. Split out of setView so the main process can
  // put the renderer back on the list without a round trip back through it.
  function applyView(name) {
    view = VIEWS.has(name) ? name : 'office';
    el('list').hidden = view !== 'list';
    el('map').hidden = view !== 'map';
    el('office').hidden = view !== 'office';
    el('composer').hidden = true;
    // The office keeps an animation loop open, so it has to be told when it
    // stops being the visible view, not merely hidden behind a style.
    window.Office.setVisible(view === 'office' && expanded);
    if (view !== 'office') { showMenu(false); showHire(false); }
    // Only the office needs it: the other views keep their footer.
    el('gear').hidden = view !== 'office';
    // An ask box only exists in the list. Left open while another view shows,
    // it held off every repaint there, freezing the map and the office.
    if (view !== 'list') openAsk = null;
    paintDock();
    // The office carries the board's own actions in its side strip, so the
    // footer would be a second copy of the same five buttons. It stays in the
    // DOM either way: the strip drives it rather than reimplementing it.
    el('foot').hidden = view === 'office';
    el('view-map').classList.toggle('on', view === 'map');
    el('view-office').classList.toggle('on', view === 'office');
    el('sub').textContent = view === 'map'
      ? 'drag to link · right-click a wire to unlink · drop on the bin to end'
      : view === 'office' ? 'one office per live session' : '';
  }

  // map and office are each a toggle: clicking the one already open goes back
  // to list, which is otherwise never its own button.
  function toggleView(name) {
    setView(view === name ? 'list' : name);
  }

  function setView(name) {
    applyView(name);
    // The main process resolves the name itself and is the one that sizes the
    // window to it, so its answer wins. applyView runs first so the panel does
    // not wait a round trip to change, and resyncs only if the two disagree.
    window.board.setView(name).then((resolved) => {
      if (resolved && resolved !== view) applyView(resolved);
      paint();
    });
  }

  window.board.onSnapshot((data) => {
    current = data;
    syncDock();
    if (openAsk) return;
    if (view === 'map' && window.Canvas.busy()) return;
    paint();
  });
  window.board.onTick(() => {
    if (openAsk) return;              // never re-render while a question is typed
    if (view === 'map' && window.Canvas.busy()) return;  // nor mid-drag on the map
    paint();
  });
  window.board.onExpanded((v, v2) => {
    expanded = v;
    el('rail').hidden = v;
    el('full').hidden = !v;
    el('wctl').hidden = !v;
    // Always applied, not just on a change: the static HTML's own hidden
    // attributes default to showing list, and if the renderer's own starting
    // `view` already happens to match what main process sends (both now
    // default to 'office'), a change-only guard here would skip applyView
    // forever and leave the DOM stuck on the markup's default instead.
    // applyView is cheap and idempotent, so there's no cost to always running it.
    if (typeof v2 === 'string') applyView(v2);
    paint();
  });
  window.board.onError((m) => toast('collector: ' + m));
  window.board.onChrome((c) => { onTop = !!c.onTop; paintPin(); });
  window.board.onTestClick((id) => el(id).click());
  window.board.onTestReopen((match) => {
    showRecent = true;
    renderList();
    const s = current.sessions.find((x) => !x.pid && x.title.toLowerCase().includes(match.toLowerCase()));
    if (!s) { console.log('TESTREOPEN no recent session matching ' + match); return; }
    const row = document.querySelector(`.row.is-closed[data-id="${s.sessionId}"]`);
    if (!row) { console.log('TESTREOPEN no row'); return; }
    console.log('TESTREOPEN clicking ' + s.title + ' (slot ' + liveSlots() + ')');
    row.click();
  });
  window.board.onTestNode((spec) => {
    const [match, times] = spec.split('|');
    // Same as SB_TEST_TRASH: the rail has no map, so open the panel first.
    window.board.toggle(true).then(() => {
      setTimeout(() => setView('map'), 400);
      setTimeout(() => {
        const ok = window.Canvas.simulateNodeTap(match, Number(times) || 1);
        console.log('TESTNODE tapped ' + match + ' x' + (times || 1) + ': ' + ok);
      }, 1200);
    });
  });
  window.board.onTestTrash((match) => {
    // The board starts on the rail, where there is no map and so no bin to
    // drop anything on. Open it first, then switch views.
    window.board.toggle(true).then(() => {
      setTimeout(() => setView('map'), 400);
      setTimeout(() => {
        const r = window.Canvas.simulateTrash(match);
        console.log('TESTTRASH dragged ' + match + ' onto the bin: ' + JSON.stringify(r));
      }, 1300);
    });
  });
  window.board.onTestFocus((tty) => {
    const s = current.sessions.find((x) => x.tty === tty);
    if (!s) { console.log('TESTFOCUS no session on ' + tty); return; }
    const row = document.querySelector(`.row.live[data-id="${s.sessionId}"]`);
    if (!row) { console.log('TESTFOCUS no row for ' + tty); return; }
    row.click();
    console.log('TESTFOCUS clicked row for ' + s.title + ' on ' + tty);
  });

  window.board.onTestGrip(({ target, move, taps }) => {
    const node = el(target === 'bar' ? 'grip' : 'griptoggle');
    const r = node.getBoundingClientRect();
    const at = (type, dx) => new PointerEvent(type, {
      bubbles: true, pointerId: 1,
      clientX: r.left + 6, clientY: r.top + 6,
      screenX: 500 + (dx || 0), screenY: 400,
    });
    for (let i = 0; i < (taps || 1); i++) {
      node.dispatchEvent(at('pointerdown', 0));
      if (move) node.dispatchEvent(at('pointermove', move));
      node.dispatchEvent(at('pointerup', move || 0));
    }
  });

  window.board.onAutoAsk(({ match, question }) => {
    setTimeout(() => {
      const target = current.sessions.find((s) => s.pid && s.title.toLowerCase().includes(match.toLowerCase()));
      if (target) send(target, question);
      else toast('autoask: no live session matching ' + match);
    }, 900);
  });

  // One gesture handler for the whole top bar. A drag moves the window; a tap
  // that goes nowhere is a click. Double-click is timed here rather than left to
  // the native event, which preventDefault and drag regions both interfere with.
  function moveGesture(node, { onClick, onDoubleClick } = {}) {
    const DEAD_ZONE = 4;
    const DOUBLE_MS = 400;
    let g = null;
    let lastTap = 0;

    node.onpointerdown = (ev) => {
      ev.stopPropagation();
      g = { x: ev.screenX, y: ev.screenY, travelled: 0 };
      try { node.setPointerCapture(ev.pointerId); } catch { /* synthetic pointer */ }
    };

    node.onpointermove = (ev) => {
      if (!g) return;
      const dx = ev.screenX - g.x;
      const dy = ev.screenY - g.y;
      g.travelled += Math.abs(dx) + Math.abs(dy);
      if (g.travelled < DEAD_ZONE) return;
      g.x = ev.screenX;
      g.y = ev.screenY;
      window.board.moveBy(dx, dy);
    };

    node.onpointerup = (ev) => {
      ev.stopPropagation();
      try { node.releasePointerCapture(ev.pointerId); } catch { /* not captured */ }
      const tapped = g && g.travelled < DEAD_ZONE;
      g = null;
      if (!tapped) { lastTap = 0; return; }   // a drag is never a tap
      const now = Date.now();
      if (now - lastTap < DOUBLE_MS) {
        lastTap = 0;
        if (onDoubleClick) onDoubleClick();
        else if (onClick) onClick();
      } else {
        lastTap = now;
        if (onClick) onClick();
      }
    };

    node.onpointercancel = () => { g = null; };
  }

  // The bar: drag to move, double-click anywhere on it to collapse or expand.
  moveGesture(el('grip'), { onDoubleClick: () => window.board.toggle() });
  // The dots: the same drag, but a single click is enough.
  moveGesture(el('griptoggle'), { onClick: () => window.board.toggle() });

  el('rail').onclick = () => window.board.toggle(true);
  el('collapse').onclick = () => window.board.toggle(false);
  el('view-map').onclick = () => toggleView('map');
  el('view-office').onclick = () => toggleView('office');
  function newSession(model) {
    toast(`opening a new ${model} session…`);
    window.board.openSessionWindow({ model, slot: liveSlots() })
      .then((res) => { toast(res.ok ? res.out : res.error); dockStarted(res); });
  }
  el('new-opus').onclick = () => newSession('opus');
  el('new-sonnet').onclick = () => newSession('sonnet');
  el('new-haiku').onclick = () => newSession('haiku');
  el('tile').onclick = () => {
    const ttys = current.sessions.filter((s) => s.pid && s.tty).map((s) => s.tty);
    if (!ttys.length) { toast('no terminal sessions to tile'); return; }
    toast('tiling ' + ttys.length + ' window(s)…');
    window.board.tileWindows(ttys).then((res) => toast(res.ok ? res.out : res.error));
  };
  el('refresh').onclick = () => window.board.refresh().then(() => toast('rescanned'));
  window.Canvas.init(window.board, { toast });
  window.Office.init(window.board, {
    toast,
    // Clicking a ball is the quickest way to say who you mean, and it answers
    // the "which one is that" question the colours alone cannot.
    onPick: (sessionId) => { dockAuto = true; dockSession(sessionId); },
    onBin: (sessionId) => endWorker(sessionId),
    onDock: (sessionId) => { dockAuto = true; dockSession(sessionId); },
  });

  // Leaving the office goes straight to list: it's the one other view with no
  // button of its own to toggle back off, reached only by leaving whichever
  // of map or office is open.
  el('olist').onclick = () => setView('list');
  // The gear menu's board-wide items click the footer's, rather than carrying a
  // second copy of the logic. Everything those three do (tiling, refreshing,
  // collapsing) stays defined in exactly one place.
  for (const [from, to] of [['otile', 'tile'],
                            ['orefresh', 'refresh'], ['ocollapse', 'collapse']]) {
    el(from).onclick = () => el(to).click();
  }

  // The dock: a terminal in the office's middle slot, attached to one session
  // the board hosts in tmux (host.js). When the board opens it takes the hosted
  // session opened first; clicking or dropping a ball swaps one in. A session
  // running in Terminal.app cannot come inside while it runs, so dropping one
  // offers to move its conversation into the board instead.
  let dockName = null;     // tmux name of the session on screen
  // Cleared when an attach fails, so a broken one is not retried every poll.
  // Choosing a session by hand turns it back on.
  let dockAuto = true;

  // tmux keeps the history and does the scrolling (mouse mode), so xterm keeps
  // none of its own: two scrollbacks would fight over the wheel.
  const term = new Terminal({
    fontFamily: 'Menlo, "SF Mono", monospace',
    fontSize: 12,
    cursorBlink: true,
    scrollback: 0,
    // Option+arrow moves by word in claude's input, as it does in Terminal.
    macOptionIsMeta: true,
    // Option+drag selects in the terminal itself, past tmux's mouse handling.
    macOptionClickForcesSelection: true,
    theme: { background: '#0d0f15', foreground: '#d7dae0', cursor: '#d7dae0' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el('term'));
  // Shift+Enter is a newline in claude's input but a plain Enter to a
  // terminal; Esc+Enter is what claude reads as a newline.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type === 'keydown' && e.key === 'Enter' && e.shiftKey) {
      window.board.termInput('\x1b\r');
      return false;
    }
    return true;
  });
  term.onData((d) => window.board.termInput(d));
  term.onResize(({ cols, rows }) => window.board.termResize(cols, rows));
  window.board.onTermData((d) => term.write(d));
  // The client exits when its session does (claude quit, or the session was
  // ended), and the slot moves on to the next one.
  window.board.onTermExit((name) => {
    if (name !== dockName) return;
    dockName = null;
    syncDock();
  });

  function slotShown() { return expanded && view === 'office'; }

  function refit() {
    if (!dockName || !slotShown()) return;
    try { fit.fit(); } catch { /* not laid out yet */ }
  }
  new ResizeObserver(refit).observe(el('slot'));

  function firstHosted() {
    return (current.hosted || []).slice().sort((a, b) => a.created - b.created)[0] || null;
  }

  async function attachTo(name) {
    if (!name || name === dockName) return;
    dockName = name;
    paintDock();
    refit();
    term.reset();
    const res = await window.board.termAttach({ name, cols: term.cols, rows: term.rows });
    if (!res.ok) {
      toast(res.error);
      if (dockName === name) dockName = null;
      dockAuto = false;
      paintDock();
      return;
    }
    if (slotShown()) term.focus();
  }

  async function dockSession(sessionId) {
    const s = current.sessions.find((x) => x.sessionId === sessionId);
    if (!s || !s.pid) { toast('that session is not running'); return; }
    dockAuto = true;
    if (s.hosted) { attachTo(s.hosted); return; }
    const res = await window.board.moveIntoBoard(sessionId);
    if (!res.ok) { if (res.error !== 'cancelled') toast(res.error); return; }
    attachTo(res.name);
  }

  // A session the board just started is docked straight away, before any poll
  // has seen it.
  function dockStarted(res) {
    if (res && res.ok && res.name) { dockAuto = true; attachTo(res.name); }
  }

  function syncDock() {
    if (!dockName && dockAuto) {
      const first = firstHosted();
      if (first) { attachTo(first.name); return; }
    }
    paintDock();
  }

  function paintDock() {
    el('term').hidden = !dockName;
    el('dockempty').hidden = !!dockName;
    el('dockempty').textContent = 'start a session from the gear menu, or drop a ball here';
    if (dockName && slotShown()) requestAnimationFrame(refit);
  }

  // Files dropped on the terminal type their paths, quoted the way Terminal
  // does it, which is how claude is handed an image or a file to read.
  function shellEscape(p) { return p.replace(/([^A-Za-z0-9_\-.,:\/@+=])/g, '\\$1'); }
  el('slot').addEventListener('dragover', (e) => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  el('slot').addEventListener('drop', (e) => {
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
    if (!files.length) return;
    e.preventDefault();
    if (!dockName) { toast('no session in the dock'); return; }
    const paths = files.map((f) => window.board.pathForFile(f)).filter(Boolean);
    if (paths.length) window.board.termInput(paths.map(shellEscape).join(' ') + ' ');
    term.focus();
  });
  // Anywhere else, a dropped file must not navigate the board away to it,
  // which is what a browser window does with a file it is handed.
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => e.preventDefault());

  function docked() {
    return current.sessions.find((s) => s.pid && s.hosted && s.hosted === dockName) || null;
  }

  // The slot's bar names the docked session, and above it a box for every
  // other live one.
  function paintDockHeads() {
    const lead = docked();
    el('dockwho').textContent = lead ? (lead.title || lead.sessionId.slice(0, 8)) : 'no live sessions';
    el('dockwho').className = 'lead ' + ctxLevel(lead);
    el('dockhandoff').hidden = !ctxLevel(lead);
    el('dockwho').title = lead
      ? 'docked: ' + (lead.title || lead.sessionId) + (tokenLine(lead) ? ' · ' + tokenLine(lead) : '')
        + ' · drop another ball here to swap'
      : '';

    const others = current.sessions.filter((s) => s.pid && (!lead || s.sessionId !== lead.sessionId));
    // A session held at a permission prompt says what it is asking for, since
    // "waiting on you" without a subject means going and looking anyway.
    const why = (s) => {
      if (s.state !== 'blocked') return LABEL[s.state] || s.state;
      const p = s.pendingTool;
      const asked = p ? (p.what ? p.name + ': ' + p.what : 'to use ' + p.name) : (s.waitingFor || 'an answer');
      return 'waiting for you to allow ' + asked;
    };
    const html = others.map((s) => `<div class="other ${ctxLevel(s)}" data-id="${esc(s.sessionId)}"
        title="${esc(s.title || '')} · ${esc(why(s))}${tokenLine(s) ? esc(' · ' + tokenLine(s)) : ''}"
        <span class="pip" style="background: var(--${esc(s.state)})"></span>
        <span class="what">${esc(s.title || s.sessionId.slice(0, 8))}</span>
        ${ctxLevel(s) ? '<span class="go" data-act="handoff" title="context is large: start a fresh session from a summary of this one">hand off</span>' : ''}
        <span class="go" data-act="show" title="bring its window back">show</span>
        <span class="go" data-act="end" title="end this session">&times;</span></div>`).join('');

    // Only rewritten when it would actually look different, because this runs
    // on every poll and replacing the nodes would kill any hover underway.
    if (el('others').dataset.sig === html) return;
    el('others').dataset.sig = html;
    el('others').innerHTML = html;
    for (const box of el('others').querySelectorAll('.other')) {
      const row = current.sessions.find((x) => x.sessionId === box.dataset.id);
      box.classList.toggle('is-blocked', !!row && row.state === 'blocked');
      box.onclick = (e) => {
        const act = e.target.dataset && e.target.dataset.act;
        if (act === 'show') { e.stopPropagation(); showSession(box.dataset.id); return; }
        if (act === 'end') { e.stopPropagation(); endWorker(box.dataset.id); return; }
        if (act === 'handoff') { e.stopPropagation(); if (row) handOff(row); return; }
        dockAuto = true;
        dockSession(box.dataset.id);
      };
    }
  }

  el('dockhandoff').onclick = () => { const lead = docked(); if (lead) handOff(lead); };


  // ---- plan usage strip ------------------------------------------------
  // The same two percentages /usage shows, read from the rate-limit event the
  // API attaches to every response (main.js probeLimits). Account-wide: any
  // session's work moves them.
  let planLimits = null;

  function resetText(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    // Within the day the minute matters; days away, the hour is plenty and
    // the shorter form is what fits the 390px list.
    if (ms - Date.now() < 20 * 3600 * 1000) {
      return 'resets ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(':00', '');
    }
    return 'resets ' + d.toLocaleDateString([], { weekday: 'short' }) + ' '
      + d.toLocaleTimeString([], { hour: 'numeric' });
  }

  function paintLimit(key, w) {
    const used = w && w.used != null ? w.used : null;
    const pct = used == null ? null : Math.round(used * 100);
    const fill = el(key + 'fill');
    fill.style.width = (pct == null ? 0 : Math.min(100, pct)) + '%';
    fill.className = 'fill' + (pct >= 90 ? ' over' : pct >= 75 ? ' near' : '');
    el(key + 'pct').textContent = pct == null ? '?' : pct + '%';
    el(key + 'rst').textContent = resetText(w && w.resetsAt);
  }

  function paintLimits() {
    if (!planLimits) return;
    el('limits').hidden = false;
    paintLimit('l5', planLimits.fiveHour);
    paintLimit('l7', planLimits.weekly);
    const mins = Math.round((Date.now() - planLimits.at) / 60000);
    el('limits').title = `Pro plan usage limits, the same figures /usage shows. Checked ${
      mins < 1 ? 'just now' : mins + ' min ago'}; updates every 15 min, click to check now.`
      + (planLimits.status && planLimits.status !== 'allowed' ? ` Status: ${planLimits.status}.` : '');
  }

  window.board.onLimits((l) => { planLimits = l; paintLimits(); });
  el('limits').onmouseenter = paintLimits; // keeps "checked N min ago" honest
  el('limits').onclick = async () => {
    el('limits').style.opacity = '.55';
    const l = await window.board.refreshLimits();
    el('limits').style.opacity = '';
    if (l) { planLimits = l; paintLimits(); }
  };
  // Reset times are relative ("resets 4 pm" becomes a weekday once it's far
  // off), so repaint now and then even with no new data.
  setInterval(paintLimits, 60000);

  // ---- usage panel ------------------------------------------------------
  let usagePeriod = '7d';
  try { usagePeriod = localStorage.getItem('usagePeriod') || '7d'; } catch { /* private window */ }
  const PERIOD_LABEL = { today: 'today', '7d': 'in the last 7 days', '30d': 'in the last 30 days', all: 'all time' };

  function fmtUsd(n) {
    if (n > 0 && n < 0.01) return '<$0.01';
    return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function usageRows(items, label) {
    const max = Math.max(...items.map((x) => x.usd), 0) || 1;
    return items.map((x) => {
      const tip = `${label(x).plain} · ${fmtUsd(x.usd)} · ${fmtTokens(x.tokens)} tokens · ${x.turns} turns`
        + (x.unpriced ? ` · ${fmtTokens(x.unpriced)} tokens on a model with no price` : '');
      return `<div class="u-row" title="${esc(tip)}">
        <span class="u-name">${label(x).html}</span>
        <span class="u-track"><div class="u-bar" style="width:${(x.usd / max * 100).toFixed(1)}%"></div></span>
        <span class="u-val">${fmtUsd(x.usd)}</span></div>`;
    }).join('');
  }

  async function renderUsage() {
    for (const b of el('utabs').querySelectorAll('button')) b.classList.toggle('on', b.dataset.p === usagePeriod);
    const body = el('ubody');
    if (!body.dataset.loaded) body.innerHTML = '<div class="u-note">counting every transcript, a couple of seconds the first time…</div>';
    const asked = usagePeriod;
    const r = await window.board.usageSummary(asked);
    if (asked !== usagePeriod) return; // a newer tab click is already on its way
    if (!r.ok) { body.innerHTML = `<div class="u-note">${esc(r.error || 'could not read usage')}</div>`; return; }
    body.dataset.loaded = '1';
    const t = r.total;
    const plain = (s) => ({ plain: s, html: esc(s) });
    body.innerHTML = `
      <div class="u-hero">${fmtUsd(t.usd)}<small>${esc(PERIOD_LABEL[r.period])}</small></div>
      <div class="u-stats">${fmtTokens(t.tokens)} tokens · ${t.turns.toLocaleString()} turns · ${r.sessionCount} sessions</div>
      <div class="u-note">API-equivalent: what these tokens would cost at per-token API prices. A Pro or Max
        subscription isn't billed this way, but it's the fair way to compare one session, model or project
        with another. Each response is counted once, even where a forked session copied it.${t.unpriced
          ? ` ${fmtTokens(t.unpriced)} tokens were on a model with no known price and aren't in the dollars.` : ''}</div>
      ${t.turns ? `
      <h3>By model</h3>${usageRows(r.byModel, (x) => plain(x.name.replace(/^claude-/, '').replace(/-\d{8}$/, '')))}
      <h3>By project</h3>${usageRows(r.byProject.slice(0, 8), (x) => plain(x.name))}
      <h3>Most expensive sessions</h3>${usageRows(r.bySession, (x) => ({
        plain: `${x.title} (${x.project})`,
        html: `${esc(x.title)}<small>${esc(x.project)}</small>`,
      }))}` : '<div class="u-note">Nothing used in this period.</div>'}`;
  }

  function showUsage(on) {
    el('usage').hidden = !on;
    el('usage-btn').classList.toggle('on', on);
    el('ousage').classList.toggle('on', on);
    if (on) renderUsage();
  }
  el('usage-btn').onclick = () => showUsage(el('usage').hidden);
  el('ousage').onclick = () => showUsage(el('usage').hidden);
  el('uclose').onclick = () => showUsage(false);
  el('utabs').onclick = (e) => {
    const p = e.target.dataset && e.target.dataset.p;
    if (!p) return;
    usagePeriod = p;
    try { localStorage.setItem('usagePeriod', p); } catch { /* private window */ }
    renderUsage();
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el('usage').hidden) showUsage(false); });

  // The gear's menu. Every item closes it, the way a menu does; + new then
  // opens its own form in the same corner.
  function showMenu(on) {
    el('setmenu').hidden = !on;
    el('gear').classList.toggle('on', on);
  }
  el('gear').onclick = (e) => { e.stopPropagation(); showMenu(el('setmenu').hidden); };
  el('setmenu').addEventListener('click', () => showMenu(false));
  // Putting the terminals away is what makes the office stand in for them, so
  // the same button has to bring them back; a one-way hide would be a trap.
  // Only windows this app hid are brought back, so anything closed or
  // minimised by hand stays as the user left it.
  // Whether the terminals are away is asked of Terminal rather than remembered,
  // so restarting the board while they are hidden still offers to bring them
  // back instead of forgetting it ever hid them.
  let termsAway = false;
  function paintHideBtn() {
    el('ohide').textContent = termsAway ? 'bring back' : 'put away';
    el('ohide').classList.toggle('on', termsAway);
  }
  async function syncHideBtn() {
    const away = await window.board.sessionsAway();
    if (away > 0 === termsAway) return;
    termsAway = away > 0;
    paintHideBtn();
  }
  el('ohide').onclick = async () => {
    const lead = docked();
    const res = termsAway
      ? await window.board.showSessions()
      : await window.board.hideSessions(lead && lead.sessionId);
    toast(res.ok ? res.out : res.error);
    await syncHideBtn();
  };

  // A session blocked on a permission prompt cannot be answered from here: the
  // prompt lives in that terminal's own display and nothing outside it can
  // reach the keystroke. Bringing the window back and focusing it is the whole
  // of what the board can honestly offer.
  async function showSession(sessionId) {
    const row = current.sessions.find((s) => s.sessionId === sessionId);
    if (!row || !row.tty) { toast('no terminal for that one'); return; }
    await window.board.showSessions();
    const res = await window.board.focusSession(row.tty);
    if (!res.ok) toast(res.error);
    await syncHideBtn();
  }

  async function endWorker(sessionId) {
    const row = current.sessions.find((s) => s.sessionId === sessionId);
    if (!row) return;
    const res = await window.board.endSession({ pid: row.pid, title: row.title });
    // That handler reports every outcome in `reason`, success or not, and
    // carries no `error` at all. Reading the wrong field meant a refusal, a
    // cancel, or a pid that no longer looks like a session all showed an empty
    // toast, which reads as nothing having happened.
    toast(res.reason || res.error || (res.killed ? 'ended ' + (row.title || '') : 'nothing to end'));
  }

  function showHire(on) {
    el('ohirepop').hidden = !on;
    el('onew').classList.toggle('on', on);
    if (!on) return;
    el('hmodel').value = 'sonnet';
    el('hname').focus();
  }
  el('onew').onclick = (e) => { e.stopPropagation(); showHire(el('ohirepop').hidden); };
  el('hcancel').onclick = () => showHire(false);
  el('hgo').onclick = async () => {
    const name = el('hname').value.trim();
    if (!name) { el('hname').focus(); return; }
    showHire(false);
    toast('starting ' + name + '…');
    const res = await window.board.openSessionWindow({
      slot: liveSlots(),
      name,
      purpose: el('hwhy').value.trim(),
      mode: el('hmode').value,
      model: el('hmodel').value,
    });
    toast(res.ok ? res.out : res.error);
    dockStarted(res);
    if (res.ok) { el('hname').value = ''; el('hwhy').value = ''; }
  };

  // Anywhere else dismisses it, which is what a popover is expected to do and
  // means it can never be left open over the plan.
  document.addEventListener('click', (e) => {
    if (!el('setmenu').hidden && !el('setmenu').contains(e.target)) showMenu(false);
    if (!el('ohirepop').hidden && !el('ohirepop').contains(e.target)) showHire(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    showMenu(false);
    showHire(false);
  });

  // Two stacked panes: the front one is filled while the board floats above
  // everything, hollow once it sits in the window order like anything else.
  function paintPin() {
    const front = onTop
      ? '<rect x="4.4" y="1.4" width="6.2" height="6.2" rx="1.6" fill="currentColor"/>'
      : '<rect x="4.4" y="1.4" width="6.2" height="6.2" rx="1.6" fill="var(--bg)" stroke="currentColor" stroke-width="1.2"/>';
    const b = el('pin');
    b.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12">
      <rect x="1.4" y="4.4" width="6.2" height="6.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/>
      ${front}</svg>`;
    b.title = onTop ? 'on top of other windows — click to let them cover it' : 'behind other windows — click to keep it on top';
    b.classList.toggle('on', onTop);
  }

  // The top bar drags the window, so a control sitting on it has to keep its own
  // pointer events to itself or every click would read as the start of a drag.
  function control(node, fn) {
    node.onpointerdown = (ev) => ev.stopPropagation();
    node.onpointerup = (ev) => ev.stopPropagation();
    node.onclick = (ev) => { ev.stopPropagation(); fn(); };
  }

  control(el('pin'), () => window.board.setOnTop(!onTop).then((v) => {
    onTop = v;
    paintPin();
    toast(v ? 'staying on top' : 'other windows can cover it now');
  }));
  control(el('stow'), () => window.board.stow());
  control(el('close'), () => window.board.quit());
  paintPin();
</script>
